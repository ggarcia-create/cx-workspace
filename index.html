<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CX Workspace</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="seasons.css"><link rel="stylesheet" href="report.css"></head>
<body>
<div id="startup-status" class="login-card" role="status"><h1>Abriendo CX Workspace…</h1><p>Preparando el acceso seguro.</p></div>
<script src="startup.js"></script>
<div class="shell" hidden>
<aside class="sidebar" aria-label="Navegación principal">
 <div class="brand"><div class="brandmark">cx<span>•</span></div><div class="brandtext">Workspace<small>Customer Experience</small></div><button id="collapse" class="iconbtn" aria-label="Contraer barra lateral" aria-expanded="true"></button></div>
 <div class="nav-label">ESPACIO DE TRABAJO</div>
 <nav id="navigation"></nav>
 <div class="sidebar-bottom"><div class="teammark">CX</div><div class="brandtext">Equipo de experiencia<small>Un espacio para resolver</small></div></div>
</aside>
<div class="workspace">
 <header class="topbar"><div class="workspace-label"><span class="statusdot"></span>Customer Experience</div><div class="search-wrap"><label class="search" for="global-search"><span id="search-icon"></span><input id="global-search" autocomplete="off" placeholder="Buscar pedido, serie, producto o expediente…" aria-controls="search-results" aria-expanded="false"><kbd id="shortcut">⌘ K</kbd></label><div id="search-results" class="popover results" hidden></div></div><div class="top-actions"><button id="notifications" class="iconbtn" aria-label="Notificaciones" aria-expanded="false"></button><span class="vertical-line"></span><button id="profile-button" class="profile-button" aria-label="Cuenta de usuario"><span class="avatar">CX</span><span class="user"><strong>Usuario CX</strong><span>Customer Experience</span></span></button></div><div id="notification-panel" class="popover notification-panel" hidden><h3>Notificaciones</h3><div class="notification-empty">Estás al día<small>No hay notificaciones por ahora.</small></div></div></header>
 <main id="content" tabindex="-1"></main>
 <footer><span>CX Workspace</span><span>v0.10.1</span></footer>
</div>
</div>
<script src="tauri-bridge.js"></script><script src="cloud-auth.js"></script><script src="auth.js"></script>
<script src="seasons.js"></script>
<script src="claim-components.js"></script>
<script src="settings.js"></script>
<script src="claim-analytics.js"></script><script src="report-builder.js"></script><script src="dashboard.js"></script>
<script src="app.js"></script>
</body></html>
